name: release
# 태그(v*)를 밀거나 수동으로 실행하면 휴대용 zip을 만든다. 태그면 GitHub 릴리스에 올린다.
# 코드 서명은 인증서가 정해지면 scripts/package.ps1 -Sign 으로 켠다(PRD 오픈 이슈).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # 툴체인은 rust-toolchain.toml이 고정한다.
      - uses: Swatinem/rust-cache@v2
      - name: 패키징
        shell: pwsh
        run: scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ldf-studio-windows-x64
          path: dist/*.zip*
      - name: 릴리스에 올리기
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" (Get-ChildItem dist/*.zip*).FullName --title "${{ github.ref_name }}" --generate-notes
