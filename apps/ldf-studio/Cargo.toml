[package]
name = "ldf-studio"
description = "LDF Studio: eframe(egui) 데스크톱 앱"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ldf-engine.workspace = true
ldf-model.workspace = true
ldf-check.workspace = true
ldf-syntax.workspace = true
eframe = { workspace = true, features = ["accesskit", "default_fonts", "glow", "persistence", "wgpu"] }
egui.workspace = true
egui_extras.workspace = true
egui_ltreeview.workspace = true
rfd.workspace = true
serde.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"